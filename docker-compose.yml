services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hs
      POSTGRES_PASSWORD: hs_dev_password
      POSTGRES_DB: harishankar
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hs -d harishankar"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hs:hs_dev_password@db:5432/harishankar
      TEST_DATABASE_URL: postgresql+psycopg://hs:hs_dev_password@db:5432/harishankar_test
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
