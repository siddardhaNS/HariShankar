services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hs
      POSTGRES_PASSWORD: hs_dev_password
      POSTGRES_DB: harishankar
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hs -d harishankar"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hs:hs_dev_password@db:5432/harishankar
      TEST_DATABASE_URL: postgresql+psycopg://hs:hs_dev_password@db:5432/harishankar_test
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Show reminders and WhatsApp sending (prints messages to its log until a provider is chosen)
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hs:hs_dev_password@db:5432/harishankar
    volumes:
      - ./backend:/app
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    command: python -m app.worker

  # Admin website. Runs in Linux because Windows Smart App Control blocks the
  # unsigned native files Next.js and Tailwind load on Windows.
  admin:
    image: node:24-bookworm-slim
    working_dir: /app
    environment:
      API_URL: http://api:8000
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
      - admin_next:/app/.next
    depends_on:
      api:
        condition: service_started
    command: sh -c "npm ci && npm run dev"

volumes:
  pgdata:
  admin_node_modules:
  admin_next:
